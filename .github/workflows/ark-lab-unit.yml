name: Ark lab unit tests
on:
  push:
    paths: &ark_paths
      - 'ark/**'
      - 'scripts/ark/**'
      - 'docs/ark/**'
      - 'deploy/ark/**'
      - '.github/workflows/ark-lab-unit.yml'
  pull_request:
    paths: *ark_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ark-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ark
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --lib --tests
      - run: npm run secrets:check
        working-directory: .
